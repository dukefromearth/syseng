[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[project]
name = "typed-reactive-graph"
version = "0.1.0"
description = "Schema-authored deterministic reactive graph MCP server"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6,<7", "mcp>=2,<3", "anyio>=4,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11", "mypy>=1.15", "types-jsonschema", "types-PyYAML", "build"]
[project.scripts]
typed-graph = "typed_graph.adapters.mcp_server:main"
[tool.hatch.build.targets.wheel]
packages = ["src/typed_graph"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
strict = true
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
