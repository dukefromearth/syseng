name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock && python -m pip install --no-build-isolation --no-deps -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src scripts/preview.py examples/architectural_metamodel/author.py
      - run: pytest
      - run: python -m build --no-isolation
